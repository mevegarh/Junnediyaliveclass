<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>StudyBridge v4</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    color:#172033;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:5px;
    color:#cbd5e1;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:18px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
    margin-bottom:15px;
}

button{
    border:0;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    margin:5px;
}

.primary{
    background:#2563eb;
    color:white;
}

.success{
    background:#16a34a;
    color:white;
}

.danger{
    background:#dc2626;
    color:white;
}

.secondary{
    background:#e5e7eb;
    color:#111827;
}

select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    margin:10px 0;
    font-size:16px;
}

video{
    width:100%;
    max-height:450px;
    background:#000;
    border-radius:12px;
    margin-top:10px;
}

.status{
    padding:12px;
    background:#eef2ff;
    border-radius:10px;
    margin:10px 0;
}

.recording{
    border-left:5px solid #2563eb;
    background:#f8fafc;
    padding:15px;
    border-radius:10px;
    margin-top:12px;
}

.recording h3{
    margin-bottom:5px;
}

.recording small{
    color:#64748b;
}

.empty{
    text-align:center;
    color:#64748b;
    padding:20px;
}

.hidden{
    display:none;
}

.role-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    background:#dbeafe;
    color:#1d4ed8;
    border-radius:20px;
    font-size:12px;
    margin-top:5px;
}

footer{
    text-align:center;
    padding:20px;
    color:#64748b;
}
</style>
</head>

<body>

<header>
    <h1>📚 StudyBridge v4</h1>
    <p>Live Classes • Recordings • Learning</p>
</header>

<div class="container">

    <!-- ROLE SELECTION -->
    <div class="card" id="roleCard">
        <h2>Choose Your Role</h2>

        <div class="role-buttons">
            <button class="primary" onclick="showTeacher()">
                👨‍🏫 Teacher
            </button>

            <button class="secondary" onclick="showStudent()">
                👨‍🎓 Student
            </button>
        </div>
    </div>


    <!-- TEACHER PANEL -->
    <div class="card hidden" id="teacherPanel">

        <h2>👨‍🏫 Teacher Dashboard</h2>

        <label>Select Subject</label>

        <select id="subject">
            <option>English</option>
            <option>Maths</option>
            <option>Science</option>
            <option>Social Science</option>
            <option>Other Subject</option>
        </select>

        <div class="status" id="teacherStatus">
            ⚪ Class is not live
        </div>

        <video
            id="camera"
            autoplay
            muted
            playsinline
            class="hidden">
        </video>

        <div>
            <button
                class="success"
                id="startBtn"
                onclick="startClass()">
                🔴 Start Live Streaming
            </button>

            <button
                class="danger hidden"
                id="stopBtn"
                onclick="stopClass()">
                ⏹️ Stop Live Streaming
            </button>
        </div>

    </div>


    <!-- STUDENT PANEL -->
    <div class="card hidden" id="studentPanel">

        <h2>👨‍🎓 Student Dashboard</h2>

        <div class="status">
            📡 Live Classes
        </div>

        <div id="liveStatus">
            No class is currently live.
        </div>

    </div>


    <!-- RECORDED CLASSES -->
    <div class="card">

        <h2>🎥 Recorded Classes</h2>

        <div id="recordings">
            <div class="empty">
                No recorded classes yet.
            </div>
        </div>

    </div>

</div>

<footer>
    StudyBridge v4 © 2026
</footer>


<script>

let mediaStream = null;
let mediaRecorder = null;
let recordedChunks = [];

let recordings = JSON.parse(
    localStorage.getItem("studybridgeRecordings") || "[]"
);


/* =========================
   ROLE FUNCTIONS
========================= */

function showTeacher(){

    document.getElementById("teacherPanel")
        .classList.remove("hidden");

    document.getElementById("studentPanel")
        .classList.add("hidden");
}


function showStudent(){

    document.getElementById("studentPanel")
        .classList.remove("hidden");

    document.getElementById("teacherPanel")
        .classList.add("hidden");

    updateLiveStatus();
}


/* =========================
   START LIVE CLASS
========================= */

async function startClass(){

    const subject =
        document.getElementById("subject").value;

    try{

        /*
        Prefer the BACK CAMERA.
        On phones, facingMode: environment
        requests the rear camera.
        */

        mediaStream = await navigator.mediaDevices
            .getUserMedia({
                video:{
                    facingMode:{
                        ideal:"environment"
                    }
                },
                audio:true
            });

        const camera =
            document.getElementById("camera");

        camera.srcObject = mediaStream;
        camera.classList.remove("hidden");

        recordedChunks = [];

        mediaRecorder =
            new MediaRecorder(mediaStream);

        mediaRecorder.ondataavailable = function(event){

            if(event.data.size > 0){
                recordedChunks.push(event.data);
            }

        };

        mediaRecorder.onstop = function(){

            saveRecording(subject);

        };

        mediaRecorder.start();

        localStorage.setItem(
            "studybridgeLive",
            JSON.stringify({
                live:true,
                subject:subject
            })
        );

        document.getElementById("teacherStatus")
            .innerHTML =
            "🔴 <b>LIVE:</b> " + subject;

        document.getElementById("startBtn")
            .classList.add("hidden");

        document.getElementById("stopBtn")
            .classList.remove("hidden");

        updateLiveStatus();

    }
    catch(error){

        alert(
            "Camera/Microphone permission is required.\n\n" +
            error.message
        );

    }

}


/* =========================
   STOP LIVE CLASS
========================= */

function stopClass(){

    if(!mediaRecorder) return;

    mediaRecorder.stop();

    if(mediaStream){

        mediaStream.getTracks().forEach(
            track => track.stop()
        );

    }

    document.getElementById("camera")
        .classList.add("hidden");

    document.getElementById("startBtn")
        .classList.remove("hidden");

    document.getElementById("stopBtn")
        .classList.add("hidden");

    document.getElementById("teacherStatus")
        .innerHTML =
        "🟢 Class finished — saving recording...";

    localStorage.removeItem("studybridgeLive");

    updateLiveStatus();

}


/* =========================
   SAVE RECORDING
========================= */

function saveRecording(subject){

    const blob =
        new Blob(
            recordedChunks,
            {type:"video/webm"}
        );

    const url =
        URL.createObjectURL(blob);

    const recording = {

        id:Date.now(),

        subject:subject,

        date:new Date()
            .toLocaleString(),

        url:url

    };

    recordings.push(recording);

    /*
    Store metadata locally.
    The video Blob itself remains available
    during this page session.
    */

    localStorage.setItem(
        "studybridgeRecordings",
        JSON.stringify(
            recordings.map(r => ({
                id:r.id,
                subject:r.subject,
                date:r.date
            }))
        )
    );

    displayRecordings();

    document.getElementById("teacherStatus")
        .innerHTML =
        "✅ Class finished and added to Recorded Classes.";

}


/* =========================
   DISPLAY RECORDINGS
========================= */

function displayRecordings(){

    const box =
        document.getElementById("recordings");

    if(recordings.length === 0){

        box.innerHTML =
            '<div class="empty">' +
            'No recorded classes yet.' +
            '</div>';

        return;
    }

    box.innerHTML = "";

    recordings.slice().reverse()
        .forEach(function(recording){

        const div =
            document.createElement("div");

        div.className = "recording";

        div.innerHTML = `

            <h3>📚 ${recording.subject}</h3>

            <span class="badge">
                Recorded Class
            </span>

            <br><br>

            <small>
                ${recording.date}
            </small>

            ${
                recording.url
                ?
                `<video
                    controls
                    src="${recording.url}">
                </video>`
                :
                `<p>
                    Recording is available only
                    in the current session.
                </p>`
            }

        `;

        box.appendChild(div);

    });

}


/* =========================
   LIVE STATUS
========================= */

function updateLiveStatus(){

    const live =
        JSON.parse(
            localStorage.getItem("studybridgeLive")
            || "null"
        );

    const box =
        document.getElementById("liveStatus");

    if(!box) return;

    if(live && live.live){

        box.innerHTML = `
            <div class="status">
                🔴 <b>LIVE NOW</b><br><br>
                Subject: ${live.subject}
                <br><br>
                👨‍🏫 Teacher is currently
                taking the class.
            </div>
        `;

    }else{

        box.innerHTML =
            "No class is currently live.";

    }

}


/* =========================
   INITIAL LOAD
========================= */

displayRecordings();
updateLiveStatus();

</script>

</body>
</html>
